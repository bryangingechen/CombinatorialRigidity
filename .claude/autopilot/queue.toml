# The autopilot queue (autoformalize-driver, interface v1). Items run in file order: the driver
# runs the first item with done = false, and stops *before* an item with attended = true.
# - The session that closes an item sets its done = true in the closing commit.
# - Only the PI reorders items or adds them.
# - `id` is the argument of `/coordinate-phase`, and `note` is the item's work log. An item whose
#   work log doesn't exist yet hasn't opened.
