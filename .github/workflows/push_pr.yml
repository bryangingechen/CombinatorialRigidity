name: Pull request CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build project (PR check)
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Build and lint Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build: true
          lint: true

      # `home_page/upstreaming.md` includes the dashboard this step
      # generates, so the homepage build fails without it (every PR check
      # failed this way until 2026-10-25). Keep it in step with `push.yml`.
      - name: Upstreaming dashboard
        uses: leanprover-community/upstreaming-dashboard-action@main
        with:
          website-directory: ./home_page
          project-name: CombinatorialRigidity
          branch-name: master

      # Build the blueprint and docs on PRs so we catch breakage before
      # merging, but do not deploy from PRs.
      - name: Compile blueprint and documentation (no deploy)
        uses: leanprover-community/docgen-action@main
        with:
          blueprint: true
          homepage: home_page
          deploy: false
