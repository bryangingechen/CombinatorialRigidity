# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
# Schema: https://github.com/mathlib-initiative/formalization.yaml
# Requiredness/conformance:
#   - Fields marked [required] should be present and filled.
#   - Fields not marked [required] are examples/recommended metadata only; they may be omitted.
#   - Projects may add extra YAML keys at any level. Readers should tolerate unknown keys.
# This is a lightweight reporting schema, not a closed validation schema.

version: "v0.4"

# project - the formalization itself (not the source).
project:
  name: "CombinatorialRigidity"                                  # [required]
  authors: ["Bryan Gin-ge Chen"]                                 # [required] who did the formalization
  responsible_maintainers: ["Bryan Gin-ge Chen"]                 # responsible for this repository
  license: "Apache-2.0"                                          # [required]
  repository: "https://github.com/bryangingechen/CombinatorialRigidity"
  website: "https://bryangingechen.github.io/CombinatorialRigidity/"
  blueprint: "https://bryangingechen.github.io/CombinatorialRigidity/blueprint/"

# The top-level `repository:` key (v0.4) is deliberately omitted: this repository is
# the substantive development, which is the schema's default when the key is absent.
# (`project.repository` above is just this repo's URL - a different, project-scoped field.)

# sources - what was formalized. Sources may be articles, books, web posts, folklore,
# conversations, or anything else.
sources:                                                          # [required] list of sources
  - title: "On graphs and rigidity of plane skeletal structures"
    authors: ["G. Laman"]
    id: "doi:10.1007/BF01534980"
    type: "article"
    location: "main theorem"
    relationship: "formalizes"
    author_endorsement: "n/a"                                    # classical (1970), author deceased

  - title: "On generic rigidity in the plane"
    authors: ["L. Lovász", "Y. Yemini"]
    id: "doi:10.1137/0603009"
    type: "article"
    location: "main theorem (rigidity matroid = (2,3)-count matroid)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

  - title: "Pebble game algorithms and sparse graphs"
    authors: ["A. Lee", "I. Streinu"]
    id: "doi:10.1016/j.disc.2007.07.104"
    type: "article"
    location: "pebble-game correctness in the matroidal regime l < 2k (Theorem 5(4) for the free-edge count)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: "Generalizes the original (2,3) pebble game of Jacobs-Hendrickson 1997, doi:10.1006/jcph.1997.5809 (mathematical antecedent, not formalized separately)."

  - title: "On the problem of decomposing a graph into n connected factors"
    authors: ["W. T. Tutte"]
    id: "doi:10.1112/jlms/s1-36.1.221"
    type: "article"
    location: "main theorem (tree packing)"
    relationship: "formalizes"
    author_endorsement: "n/a"                                    # classical (1961), author deceased

  - title: "Edge-disjoint spanning trees of finite graphs"
    authors: ["C. St. J. A. Nash-Williams"]
    id: "doi:10.1112/jlms/s1-36.1.445"
    type: "article"
    location: "main theorem (tree packing)"
    relationship: "formalizes"
    author_endorsement: "n/a"                                    # classical (1961), author deceased

  - title: "The union of matroids and the rigidity of frameworks"
    authors: ["W. Whiteley"]
    id: "doi:10.1137/0401025"
    type: "article"
    location: "Theorem 1 (k-frame matroid = k-fold cycle-matroid union), Theorem 8 (body-bar), Proposition 6"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

  - title: "Rigidity of multi-graphs. I. Linking rigid bodies in n-space"
    authors: ["T.-S. Tay"]
    id: "doi:10.1016/0095-8956(84)90016-9"
    type: "article"
    location: "main theorem (body-bar)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

  - title: "Linking (n-2)-dimensional panels in n-space II: (n-2,2)-frameworks and body and hinge structures"
    authors: ["T.-S. Tay"]
    id: "doi:10.1007/BF01788678"
    type: "article"
    location: "main theorem (body-hinge / panel-hinge)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

  - title: "The generic rank of body-bar-and-hinge frameworks"
    authors: ["B. Jackson", "T. Jordán"]
    id: "doi:10.1016/j.ejc.2009.03.030"
    type: "article"
    location: "Thm 6.1 / Cor 6.2 (def = corank); §5 (body-bar), §6-§7 (body-hinge / panel-hinge: Thm 6.1, Cor 6.3, Thm 7.2), p. 586"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Source of the def = corank bridge (Thm 6.1 / Cor 6.2) and, in phase 34, of the
      coordinate route to the generic ("almost all realizations") form of the realization
      theorems: its section 5 (body-bar), sections 6-7 (body-hinge / panel-hinge, Thm 6.1,
      Cor 6.3, Thm 7.2), and the p. 586 molecular observation are formalized with the
      existential quantifiers upgraded to every generic realization.

  - title: "A proof of the molecular conjecture"
    authors: ["N. Katoh", "S. Tanigawa"]
    id: "doi:10.1007/s00454-011-9348-6"
    type: "article"
    location: "Conjecture 1.2, Lemma 2.1, Theorem 4.9, Theorem 5.5, Theorem 5.6, Corollary 5.7; §2.5/§5.1 (multigraph and panel conventions), footnote 6"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The longest-horizon target and the project's largest single undertaking (phases 17-26);
      fully formalized, including the molecular conjecture itself (Conjecture 1.2) and the
      molecule application (Corollary 5.7). Since phase 35, Conjecture 1.2 and Theorem 5.6
      are also proved at their full multigraph strength, with the panel side stated in KT's
      hinge-coplanar panel model.

  - title: "On the rigidity of molecular graphs"
    authors: ["B. Jackson", "T. Jordán"]
    id: "doi:10.1007/s00493-008-2287-z"
    type: "article"
    location: "Lemma 4.2, §5 (Conjecture 5.1, Theorem 5.3, Theorem 5.4)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: "Primary source for the molecule rank formula r(G^2) = 3|V| - 6 - def(G~) (= KT Corollary 5.7, phase 26); its Thm 5.4 (Jacobs' conjecture, made unconditional) and Lemma 4.2 (degree-1 rank formula) are formalized in phase 32."

  - title: "Generic rigidity in three-dimensional bond-bending networks"
    authors: ["D. J. Jacobs"]
    id: "J. Phys. A: Math. Gen. 31 (1998), 6653-6668"
    type: "article"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: "Origin of Jacobs' conjecture (phase 32); the statement formalized is Jackson-Jordán 2008's Conjecture 5.1 / Theorem 5.4 form."

  - title: "Generic rigidity of molecular graphs via ear decomposition"
    authors: ["D. S. Franzblau"]
    id: "doi:10.1016/S0166-218X(99)00188-2"
    type: "article"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: "The tree case of the degree-1 rank formula (phase 32); formalized through Jackson-Jordán 2008 Lemma 4.2(a)'s statement."

  - title: "Statics of frameworks and motions of panel structures: a projective geometric introduction"
    authors: ["H. Crapo", "W. Whiteley"]
    id: "Structural Topology 6 (1982), 43-82"
    type: "article"
    location: "Proposition 3.4"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: "Projective invariance of infinitesimal rigidity (phase 25)."

  - title: "Combinatorial Rigidity: Graphs and Matroids in the Theory of Rigid Frameworks"
    authors: ["T. Jordán"]
    id: "doi:10.2969/msjmemoirs/03401C020"
    type: "book"                                                # survey monograph, MSJ Memoirs 34
    relationship: "background"
    author_endorsement: "n/a"
    note: "Presentation followed and the project's cross-check for rigidity-theory attributions; not itself a formalized result."

  - title: "Matroid Theory (2nd ed., Oxford Graduate Texts in Mathematics 21)"
    authors: ["J. G. Oxley"]
    id: "isbn:978-0-19-856694-6"
    type: "book"
    location: "Thm 11.2.2"
    relationship: "background"
    author_endorsement: "n/a"
    note: "Cross-check for abstract matroid-theory attributions (Edmonds 1965/1970, Nash-Williams 1966); presentation reference."

# related_formalizations - prior or parallel formalizations, if known.
related_formalizations:
  - id: "https://github.com/apnelson1/Matroid"
    relationship: "builds-on"
    note: >-
      Peter Nelson's Lean 4 matroid package (Apache-2.0). The matroid-union / Edmonds-partition
      subsystem under CombinatorialRigidity/Matroid/ is ported from it - rebased from its shelved
      WIP/{Submodular,Union}.lean onto the package's live FiniteCircuitMatroid constructor - and it
      also supplies Matroid.ofFun and Graph.cycleMatroid. Each vendored file carries an upstream
      copyright header with a provenance + modifications note. No prior formalization of
      combinatorial rigidity theory (Laman, Tay-Whiteley, or the molecular conjecture) is known.

# classification - what area of mathematics the formalized result belongs to.
classification:
  # arXiv taxonomy (https://arxiv.org/category_taxonomy)
  arxiv: ["math.CO", "math.MG", "cs.CG"]
  # MSC2020 (https://msc2020.org/): 52C25 rigidity and flexibility of structures;
  # 05B35 combinatorial aspects of matroids; 05C70 edge subsets with special properties
  # (tree packing); 15A75 exterior/Grassmann algebras (the extensor calculus);
  # 68R10 graph theory in computer science (the pebble-game decision procedure);
  # 92E10 molecular structure, graph-theoretic methods (the molecule application).
  msc2020: ["52C25", "05B35", "05C70", "15A75", "68R10", "92E10"]

# project status
status:
  scope: >-
    A Lean 4 / mathlib4 formalization of combinatorial rigidity theory, in four arcs.
    (1) Laman's theorem (1970): a graph on >= 2 vertices is generically rigid in the plane
    iff it contains a (2,3)-tight spanning subgraph, both directions via the Henneberg
    construction. (2) The planar rigidity matroid (Lovász-Yemini) in both its combinatorial
    (2,3)-count and linear-matroid forms, plus an executable, certificate-carrying
    (k,l)-sparsity decision procedure - the Lee-Streinu pebble game - with Decidable
    instances and a `lake exe pebble-game` CLI. (3) Matroid union / Edmonds partition
    (ported from apnelson1/Matroid), Tutte-Nash-Williams tree packing, Whiteley's k-frame
    matroid, and the Tay-Whiteley body-bar and body-hinge / panel-hinge theorems.
    (4) Katoh-Tanigawa's 2011 proof of the molecular conjecture - the Grassmann-Cayley
    extensor algebra, the deficiency matroid, and the combinatorial and algebraic
    inductions - together with its molecule application, the rank formula
    r(G^2) = 3|V| - 6 - def(G~). All four arcs are complete and sorry-free; later phases
    strengthened these results without changing their shape (an arbitrary infinite field in
    place of R, multigraphs, "every generic realization" in place of "some realization")
    and drew further consequences of the rank formula. See status.main_results for the
    headline statements and fidelity.divergences for how they differ from their sources.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]          # only Lean/mathlib standard axioms; no project-specific axioms
  policy: >-
    The project carries no `sorry` and no project-specific `axiom`. During development,
    incomplete obligations were pinned as explicit hypotheses on red blueprint dep-graph
    nodes (never as `sorry` or `axiom`); with the development complete, none remain.
    `warn.sorry = true` in the lakefile is a backstop. Every main result below was checked
    with `#print axioms` and uses only the three standard axioms.
  main_results:                                                  # the completed headline theorems (four arcs + post-program phases)
  - declaration: "SimpleGraph.isGenericallyRigid_two_iff_exists_isLaman_le"
    file: "CombinatorialRigidity/LamanTheorem.lean"
    description: "Laman's theorem (1970): for n >= 2, G is generically rigid in the plane iff it contains a Laman (= (2,3)-tight) spanning subgraph."
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.linearRigidityMatroid_eq_rigidityMatroid"
    file: "CombinatorialRigidity/LinearRigidityMatroid.lean"
    description: "Lovász-Yemini, linear-matroid form: the generic-placement linear rigidity matroid (via Matroid.ofFun) equals the combinatorial (2,3)-count rigidity matroid."
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.countMatroid_indep_iff_runPebbleGame"
    file: "CombinatorialRigidity/PebbleGame/Correctness.lean"
    description: >-
      Lee-Streinu pebble-game correctness: in the matroidal regime l < 2k, edge-set
      independence in the (k,l)-count matroid is decided by the verdict-bearing pebble game.
      Powers the executable decision procedure `SimpleGraph.instDecidableIsLaman` /
      `instDecidableIsSparse` / `instDecidableIsTight` (PebbleGame/Exec.lean) and the
      `lake exe pebble-game` CLI.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "Graph.tutte_nash_williams"
    file: "CombinatorialRigidity/BodyBar/TreePacking.lean"
    description: "Tutte-Nash-Williams tree-packing (1961): a multigraph is the edge-disjoint union of k forests iff it is (k,k)-sparse. Specialized from the local Edmonds matroid-partition machinery."
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "Graph.kFrameMatroid_eq_unionPow_cycleMatroid"
    file: "CombinatorialRigidity/BodyBar/KFrame.lean"
    description: "Whiteley 1988 Theorem 1: the generic k-frame matroid equals the k-fold union of the graphic (cycle) matroid, restricted to E(G)."
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "Graph.BodyBarFramework.tay_witness"
    file: "CombinatorialRigidity/BodyBar/TayTheorem.lean"
    description: >-
      Tay's body-bar theorem (Tay 1984, Whiteley 1988 Thm 8), existence-of-realization form:
      for d = n(n+1)/2, a multigraph carries an independent (resp. isostatic) body-bar
      framework in R^n iff it is (d,d)-sparse (resp. (d,d)-tight).
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "Graph.BodyHingeFramework.body_hinge_tay"
    file: "CombinatorialRigidity/BodyBar/BodyHinge.lean"
    description: >-
      Body-hinge / panel-hinge Tay-Whiteley theorem (Tay 1989, Whiteley 1988),
      existence-of-realization form: a graph carries an independent (resp. isostatic)
      body-hinge framework in R^n iff its (d-1)-fold edge-multiplication is (d,d)-sparse
      (resp. tight), equivalently a packing of d forests.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "CombinatorialRigidity.Molecular.PanelHingeFramework.theorem_55_minimalKDof_gen"
    file: "CombinatorialRigidity/Molecular/AlgebraicInduction/Theorem55.lean"
    description: >-
      Katoh-Tanigawa 2011 Theorem 5.5 (the realization theorem, all three cases including the
      hardest, Case III): every minimal k-dof-graph on >= 2 vertices admits a
      nondegenerate-hinge panel realization whose rigidity matrix attains rank D(|V|-1) - k,
      at every dimension n >= 3 (D = (n+1 choose 2) >= 6) and over any infinite field of any
      characteristic (phase 33; KT's real statement is the K = R case); generic for simple G.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "CombinatorialRigidity.Molecular.PanelHingeFramework.rankHypothesis_of_theorem_55_gen"
    file: "CombinatorialRigidity/Molecular/AlgebraicInduction/Theorem55.lean"
    description: >-
      Katoh-Tanigawa 2011 Theorem 5.6: every simple spanning multigraph has a panel-hinge
      realization attaining the deficiency rank, rank R(G,p) = D(|V|-1) - def(G~), at every
      dimension n >= 3 and over any infinite field of any characteristic (phase 33). With the
      def = corank bridge this completes the Katoh-Tanigawa Proposition 1.1 reconciliation
      (CombinatorialRigidity.Molecular.rigidityMatrix_prop11).
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "CombinatorialRigidity.Molecular.PanelHingeFramework.molecular_conjecture"
    file: "CombinatorialRigidity/Molecular/AlgebraicInduction/Theorem55.lean"
    description: >-
      The Molecular Conjecture (Tay-Whiteley 1984; Katoh-Tanigawa 2011 Conjecture 1.2): a
      simple spanning graph on >= 2 bodies has an infinitesimally rigid genuine body-hinge
      realization iff it has one as a panel-hinge framework, at every dimension n >= 3 and
      over any infinite field of any characteristic (phase 33).
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.molecule_rank_formula"
    file: "CombinatorialRigidity/Molecular/Molecule/Application.lean"
    description: >-
      The molecule rank formula (Jackson-Jordán 2008; Katoh-Tanigawa 2011 Corollary 5.7):
      for a simple graph G of minimum degree >= 2, the rank of the square graph G^2 in the
      3-D generic bar-joint rigidity matroid is r(G^2) = 3|V| - 6 - def(G~) - the
      combinatorial flexibility count for a molecule modelled on G.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.jacobs"
    file: "CombinatorialRigidity/JacobsTheorem.lean"
    description: >-
      Jacobs' conjecture (Jacobs 1998; Jackson-Jordán 2008 Conjecture 5.1 / Theorem 5.4,
      here unconditional): the square G^2 of a simple graph is independent in the 3-D
      generic bar-joint rigidity matroid iff G^2 satisfies the three-dimensional Laman
      counting condition |E(X)| <= 3|X| - 6 for all |X| >= 3.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.degree_one_rank"
    file: "CombinatorialRigidity/JacobsDegreeOne.lean"
    description: >-
      The degree-1 rank formula (Jackson-Jordán 2008 Lemma 4.2; the tree case
      SimpleGraph.degree_one_rank_tree is due to Franzblau 2000): for a connected non-tree G,
      r(G^2) = r((G^core)^2) + 2|V \ V(G^core)| + |V_1(G)|, reducing the squared rank to the
      two-core (the maximal subgraph of minimum degree >= 2), where the molecule rank
      formula's hypothesis fails; for a tree, r(G^2) = 2|V| - 5 + |V_1(G)|.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "SimpleGraph.molecule_generic_square_packing"
    file: "CombinatorialRigidity/Molecular/Molecule/Application.lean"
    description: >-
      Generic rigidity of squares from six spanning trees (Jackson-Jordán 2010 p. 586,
      unconditional now that the molecular conjecture is a theorem; phase 34): if 5G
      contains six edge-disjoint spanning trees, then every bar-joint realization of G^2
      in R^3 at a placement generic for row independence is infinitesimally rigid.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "Graph.BodyBarFramework.isIndependent_and_isInfinitesimallyRigid_ofEndpoints_iff"
    file: "CombinatorialRigidity/BodyBar/GenericLift.lean"
    description: >-
      Tay's theorem at every generic endpoint assignment (Tay 1984; Jackson-Jordán 2010
      section 5; phase 34): the body-bar realization placing each bar on the segment
      between its assigned endpoints, at an endpoint assignment generic for row
      independence, is isostatic (independent and infinitesimally rigid) iff the
      multigraph is (d,d)-tight - the generic form of the body-bar existence theorem,
      quantifying over bar endpoint choices in R^n.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "CombinatorialRigidity.Molecular.BodyHingeFramework.isInfinitesimallyRigidOn_ofHinge_isGenericHingePoints_iff_spanningTrees"
    file: "CombinatorialRigidity/Molecular/GenericLift/HingeGeneric.lean"
    description: >-
      Generic body-and-hinge rigidity from spanning trees (Tay 1989, Whiteley 1988;
      Jackson-Jordán 2010 Thm 6.1 / Cor 6.3, with the existential quantifier upgraded to
      every generic realization; phase 34): for a simple spanning multigraph on >= 2
      bodies, at any dimension n >= 3 and over any infinite field, the affine-hinge
      framework at every hinge-point assignment generic for row independence is
      infinitesimally rigid iff (D-1)G contains D pairwise edge-disjoint spanning trees.
      The panel-normal analogue (JJ Thm 7.2, sharpened to an iff) is
      CombinatorialRigidity.Molecular.PanelHingeFramework.isInfinitesimallyRigidOn_ofNormals_isGenericNormals_iff
      (CombinatorialRigidity/Molecular/GenericLift/PanelGeneric.lean).
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

  - declaration: "CombinatorialRigidity.Molecular.molecular_conjecture_multigraph"
    file: "CombinatorialRigidity/Molecular/AlgebraicInduction/Theorem55.lean"
    description: >-
      The Molecular Conjecture at full multigraph strength (Katoh-Tanigawa 2011
      Conjecture 1.2 for multigraphs; phase 35): a spanning multigraph on any nonempty body
      set - parallel edges and loops admitted - has an infinitesimally rigid genuine body-hinge
      realization iff it has an infinitesimally rigid hinge-coplanar panel realization
      (KT's containment model: each hinge lies in the panel of each endpoint body), at
      every dimension n >= 3 and over any infinite field of any characteristic. The
      multigraph Theorem 5.6 behind it is
      CombinatorialRigidity.Molecular.theorem_55_6_multigraph.
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: ""
    literature_dependencies: []

# how it was produced. Extra per-entry fields are allowed.
automation:                                                      # [required]
  methods:                                                       # one entry per distinct phase/run/tool
    - method: "agent"                                            # [required] manual | copilot | agent | autonomous | other
      models: ["claude-opus-4-7", "claude-opus-4-8", "claude-fable-5", "claude-sonnet-5", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"]   # opus-4-7 was the workhorse through the molecular program (phases 17-26); opus-4-8, fable-5, sonnet-5, and sonnet-4-6 joined across the standalone-repo and post-program eras via the coordinator's per-task model-rung dispatch (haiku/sonnet/opus/fable); haiku-4-5 for lighter/subagent tasks. Whole-history Co-Authored-By trailer counts (2646 commits, 2026-05-06 to 2026-07-09): opus-4-8 ~1805, opus-4-7 322, fable-5 271, sonnet-5 80, sonnet-4-6 58, haiku-4-5 9.
      framework: "Claude Code"
      tool_setup: >-
        Claude Code (CLI); model chosen per task via the `coordinate-phase` orchestration
        skill's Dispatch playbook (a haiku/sonnet/opus/fable rung map, most rungs run with
        the 1M-token context option and `xhigh` reasoning effort) rather than one fixed
        model throughout. Lean interaction via the lean-lsp MCP server (goal/diagnostic/axiom-check
        tooling). `coordinate-phase` (used ~81 times as of 2026-06-07; more dispatches since)
        dispatches single-task subagents one at a time (Explore /
        general-purpose / phase-builder / recon) for search, recon, and build work;
        `/code-review` and `/simplify` skills run quality passes. A two-repo model-tier
        dispatch experiment (~890 rated dispatches, concluded 2026-07-09 - see
        `notes/model-experiment-archive.md`) produced the rung-selection rules now folded
        into the coordinator's playbook. The repository carries an extensive agent
        operating manual - a root CLAUDE.md plus area-specific CLAUDE.md files for the
        Lean sources, notes, and blueprint - that defines the per-session workflow, the
        per-commit hand-off contract, the friction review, and a forward-mode blueprint
        discipline in which the blueprint dependency graph doubles as the live to-do list.
      cost:
