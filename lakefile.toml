name = "CombinatorialRigidity"
version = "0.1.0"
defaultTargets = ["CombinatorialRigidity"]
lintDriver = "batteries/runLinter"

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true
linter.style.header = false
# Surface `sorry` as a build warning (Lean's default) so a stray one is caught
# by the warning-clean pre-commit gate. The project carries incomplete
# obligations as explicit hypotheses on red blueprint nodes — never as `sorry`
# or `axiom` — so this should always stay clean; the warning is a backstop that
# complements the per-decl `#print axioms` (`sorryAx`) check.
warn.sorry = true


# `checkdecls` provides `lake exe checkdecls`, which the docgen-action
# invokes to verify that every \lean{...} reference in the blueprint
# points to a real declaration in our Lean sources.
[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

# Phase 8: linear-matroid framing. `apnelson1/Matroid` provides
# `Matroid.ofFun` and `Module.matroid` (the matroid of a linear
# function), which sit on top of mathlib's `IndepMatroid.ofFinitaryCardAugment`
# but aren't yet upstreamed. Phases 13+ additionally import `Matroid.Graphic`
# (`Graph.cycleMatroid`) for tree-packing, and Phases 16+ the `Matroid.Graph.*`
# API. Pinned to a specific revision so future `lake update` runs are
# deliberate; the lakefile's mathlib pin takes precedence over the transitive
# one from this dep — but *only* because `require mathlib` sits below this
# block, see the comment on that require. See `notes/Phase8.md`
# *Architectural choices made up front* and `DESIGN.md`
# *Phase 8: `apnelson1/Matroid` dependency*.
#
# **The local fork is retired** (v4.34.0-rc1 bump, 2026-08-20): this pin is
# plain upstream `apnelson1/Matroid`, at a revision with green CI. The fork
# (`bryangingechen/Matroid`, branch `combinatorial-rigidity-fix`) had carried
# two patches, and neither justifies a fork any more:
#
#   1. the `unifOn_rankPos_iff` simp-drift fix is OBSOLETE — upstream
#      re-greened that proof independently;
#   2. the `deleteVerts` notation-precedence fix is STILL ABSENT upstream, but
#      the poisoning it avoided (TACTICS-QUIRKS § 48 — a scoped `notation:51`
#      for `G - S` that makes `-`-continuations like `i - 1 + 1` unparseable
#      wherever a `Graph`/`WList`-typed variable is in scope) costs only FOUR
#      sites in this tree, each with a cheap local workaround.
#
# So § 48's workarounds are load-bearing again here. Proposing the precedence
# fix upstream (widen the RESULT level to 65; leave the operands at 100) would
# retire them; § 48 carries the analysis. See `notes/ToolchainBumps.md`.
[[require]]
name = "Matroid"
git = "https://github.com/apnelson1/Matroid.git"
rev = "f44939ff4c4c03740f9e2d13e3429ab92d2edcd1"

# **`require mathlib` MUST STAY LAST.** Lake visits a package's requires in
# REVERSE order, and `addDependencyEntries` stores a transitive pin only if the
# name is not already present (`Lake/Load/Resolve.lean` -- "later requires
# should shadow earlier definitions"), so the LAST require's transitive pins
# win. With `mathlib` first, `Matroid`'s frozen manifest planted `batteries`
# and `proofwidgets` before mathlib's own manifest was read, so
# `lake update mathlib` left them stale, `lake exe cache get` hashed over a
# dependency set mathlib never tested, and the cache fetch failed -- reported
# upstream by hopscotch as a phantom "would break the build" regression, which
# wedged that workflow from 2026-05-15 to 2026-08-21. Measured both ways on
# identical trees; see `notes/ToolchainBumps.md` *The hopscotch false positive*.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"

[[lean_lib]]
name = "CombinatorialRigidity"

# `lake exe pebble-game` — Phase 10 Layer 5 CLI binary. Reads a simple
# edge-list file (leading `n m` line, then `m` lines of two
# whitespace-separated integers `0 ≤ u, v < n`) and prints one of
# `LAMAN` / `SPARSE_NOT_TIGHT` / `NOT_SPARSE` on stdout. The
# classification routes through Phase 10 Layer 3's
# `SimpleGraph.instDecidableIsLaman` and `instDecidableIsSparse`,
# which reduce through the compiled `runPebbleGameExec` body in
# polynomial time. See `blueprint/src/chapter/executable.tex`
# *CLI binary* for the input/output spec.
[[lean_exe]]
name = "pebble-game"
root = "Main"
supportInterpreter = true
